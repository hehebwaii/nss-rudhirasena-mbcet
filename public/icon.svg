<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <!-- Inner Blood Drop Shape -->
  <g filter="url(#shadow)">
    <path d="M 256 96 C 256 96 144 240 144 320 C 144 381.85 194.15 432 256 432 C 317.85 432 368 381.85 368 320 C 368 240 256 96 256 96 Z" fill="url(#dropGrad)" />
  </g>

  <!-- Central Red Cross on Blood Drop -->
  <path d="M 238 230 H 274 V 278 H 322 V 314 H 274 V 362 H 238 V 314 H 190 V 278 H 238 Z" fill="#DC2626" rx="4" />

  <!-- Sparkle Accent -->
  <circle cx="210" cy="180" r="14" fill="#FFFFFF" fill-opacity="0.7" />
  <circle cx="190" cy="210" r="8" fill="#FFFFFF" fill-opacity="0.5" />
</svg>
